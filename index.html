<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChosenCentury | Uniforms for the Faithful</title>
    <style>
        :root {
            --black: #050505; --white: #ece9e1; --dim: rgba(236,233,225,0.4);
            --faint: rgba(236,233,225,0.07); --red: #b82222; --D: 'Anton', sans-serif; --S: 'Cormorant Garamond', serif; --M: 'IBM Plex Mono', monospace;
        }
        body { background: var(--black); color: var(--white); font-family: var(--M); margin: 0; overflow-x: hidden; }

        /* Navigation */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--faint); }
        .nav-brand { font-family: var(--S); font-style: italic; font-size: 22px; color: var(--white); text-decoration: none; }
        .nav-links a { color: var(--white); text-decoration: none; font-size: 10px; letter-spacing: 2px; margin-left: 30px; text-transform: uppercase; border: 1px solid var(--white); padding: 8px 15px; transition: 0.3s; }
        .nav-links a:hover { background: var(--white); color: var(--black); }

        /* Brand Header */
        header { padding: 40px 40px 20px; text-align: center; }
        .brand-ttl { font-family: var(--D); font-size: clamp(60px, 15vw, 180px); letter-spacing: -4px; text-transform: uppercase; line-height: 0.9; }
        .brand-sub { font-size: 12px; letter-spacing: 8px; color: var(--dim); text-transform: uppercase; margin-top: 10px; margin-bottom: 30px; }

        .mission-box { max-width: 750px; margin: 10px auto; border-top: 1px solid var(--faint); border-bottom: 1px solid var(--faint); padding: 15px 0; }
        .mission-txt { font-family: var(--S); font-style: italic; font-size: 20px; line-height: 1.3; color: var(--white); margin: 0; text-align: center; }

        /* Grid Styling */
        .collection-header { padding: 30px 40px 10px; text-align: left; }
        .collection-label { color: var(--red); font-size: 10px; letter-spacing: 4px; font-weight: bold; text-transform: uppercase; }

        .shop-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 0 40px 100px; margin-top: 20px; }
        .product-card { border: 1px solid var(--faint); padding: 20px; background: #0a0a0a; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; display: flex; flex-direction: column; }
        .product-card:hover { border-color: var(--white); transform: translateY(-8px); background: #111; }

        .product-card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #050505; margin-bottom: 15px; }
        .product-title { font-family: var(--D); font-size: 18px; text-transform: uppercase; display: block; line-height: 1.2; margin-bottom: 5px; }
        .product-tag { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

        .headline-badge { background: var(--red); color: white; font-size: 8px; padding: 2px 8px; display: inline-block; margin-bottom: 10px; font-family: var(--M); }

        .buy-btn { display: block; width: 100%; padding: 12px; background: var(--white); color: var(--black); text-align: center; text-decoration: none; font-family: var(--D); font-size: 13px; text-transform: uppercase; margin-top: auto; transition: 0.2s; }
        .buy-btn:hover { background: var(--red); color: var(--white); }

        /* Footer */
        footer { padding: 100px 40px; text-align: center; border-top: 1px solid var(--faint); background: #080808; }
        .f-logo { font-family: var(--D); font-size: 40px; margin-bottom: 10px; }
        .secure-badge { font-size: 9px; color: var(--dim); letter-spacing: 2px; margin-bottom: 30px; text-transform: uppercase; }

        /* Responsive Logic */
        @media (max-width: 1200px) { .shop-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 650px) { .shop-grid { grid-template-columns: 1fr; } }

        @media (max-width: 600px) {
            nav { flex-direction: column !important; align-items: center !important; gap: 15px !important; padding: 20px !important; }
            .nav-links { width: 100% !important; justify-content: center !important; gap: 10px !important; display: flex; margin-top: 10px; }
            .nav-links a { margin: 0 5px !important; padding: 8px 12px !important; font-size: 11px !important; }
            header { padding: 40px 20px 10px !important; }
            .mission-txt { font-size: 18px !important; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="nav-brand">ChosenCentury</a>
        <div class="nav-links">
            <a href="https://chosencentury.etsy.com" target="_blank">Shop All</a>
            <a href="https://www.instagram.com/chosencentury18" target="_blank">Instagram</a>
        </div>
    </nav>

    <header>
        <div class="brand-ttl">CHOSEN<br>CENTURY</div>
        <div class="brand-sub">UNIFORMS FOR THE FAITHFUL</div>

        <div class="mission-box">
            <p class="mission-txt">
                Streetwear built on the grit of the grind and the truth of the foundation.
            </p>
        </div>
    </header>

    <div class="collection-header">
        <span class="collection-label">HEADLINE DROP / 2026</span>
    </div>

    <div class="shop-grid">
        <div class="product-card">
            <div class="headline-badge">NEW RELEASE
